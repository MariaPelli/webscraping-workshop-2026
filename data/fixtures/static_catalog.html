<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Synthetischer Testkatalog</title></head>
<body>

      <tr><td class="id">1</td><td class="title">Testbuch Alpha</td><td class="price">12.50</td></tr>
      <tr><td class="id">2</td><td class="title">Testbuch Beta</td><td class="price">18.00</td></tr>
      <tr><td class="id">3</td><td class="title">Testbuch Übermorgen</td><td class="price">24.90</td></tr>
    </tbody>
  </table>
</body>
</html>
